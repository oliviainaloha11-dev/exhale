    <h1>Box breathing</h1>
    <p class="lede">In, hold, out, hold. Four seconds each. Follow the light around the square.</p>

    <!-- ===== THE BREATHING SQUARE =====
         Drawn with SVG. breathing.js moves the dot and the glowing line. -->
    <div class="breath" id="breath">
      <svg class="breath-svg" viewBox="0 0 200 200" aria-hidden="true">
        <!-- soft square in the middle that grows as you breathe in -->
        <rect class="breath-fill" id="breathFill" x="40" y="40" width="120" height="120" rx="18"/>
        <!-- faint outline of the full path -->
        <path class="breath-track" d="M20 20 H180 V180 H20 Z"/>
        <!-- the bright line that traces as time passes -->
        <path class="breath-progress" id="breathProgress" d="M20 20 H180 V180 H20 Z"/>
        <!-- the little traveling light -->
        <circle class="breath-dot" id="breathDot" cx="20" cy="20" r="6"/>
      </svg>

      <!-- Text cue sits on top of the square -->
      <div class="breath-cue">
        <p class="breath-phase" id="phaseText">Ready when you are</p>
        <p class="breath-count" id="countText" aria-hidden="true"></p>
      </div>
    </div>

    <!-- Screen readers hear each new phase ("Breathe in", "Hold"…) -->
    <p class="visually-hidden" aria-live="polite" id="announce"></p>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn" type="button">Begin</button>
      <button class="btn" id="resetBtn" type="button" disabled>Start over</button>
    </div>

    <div class="controls breath-options">
      <label class="switch">
        <input type="checkbox" id="chimeToggle">
        Soft chime on each step
      </label>
    </div>

    <p class="breath-rounds" id="roundsText" aria-live="polite"></p>
  </main>
