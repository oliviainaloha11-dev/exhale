    <h1>Mind jar</h1>
    <p class="lede">Type a thought that's taking up space. Fold it up and drop it in the jar. Nothing you write is saved.</p>

    <!-- Where you type a thought -->
    <form class="jar-form" id="thoughtForm" autocomplete="off">
      <label class="visually-hidden" for="thought">A thought to put in the jar</label>
      <input class="field" id="thought" type="text" maxlength="120"
             placeholder="the chem test on friday…" autocomplete="off">
      <button class="btn btn-primary" type="submit">Fold it in</button>
    </form>

    <!-- The jar itself is drawn on a canvas by mind-jar.js.
         Paper previews get added inside this box while they fold. -->
    <div class="jar-stage" id="stage">
      <canvas id="jarCanvas" role="img" aria-label="An empty glass jar"></canvas>
    </div>

    <p class="status" id="status" aria-live="polite">The jar is empty.</p>

    <div class="controls">
      <button class="btn" id="shakeBtn" type="button" disabled>Shake</button>
      <button class="btn" id="releaseBtn" type="button" disabled>Release</button>
    </div>
  </main>
